# Hyprland starter: mirrors the sway basics on purpose, keep it lean.
# Polish lands here only when daily use asks for it.

$terminal = ghostty --working-directory=$HOME/git/repo
$fileManager = xdg-open .
$menu = rofi -show drun
$mainMod = SUPER

# waybar runs as a systemd user unit (see waybar.service), not here
exec-once = swaync
exec-once = lxpolkit
exec-once = swaybg -o "*" -i $HOME/Pictures/Wallpaper/background.png -m fill
exec-once = wl-paste -t text --watch clipman store
# activates graphical-session.target: portals, hypridle and hyprpolkitagent
# are user units hanging off it (see ~/.config/systemd/user/hyprland-session.target)
exec-once = systemctl --user start hyprland-session.target
# same applet startup as sway (tray icons need the SNI watcher up first)
exec-once = /usr/libexec/sway-systemd/wait-sni-ready && (blueman-applet & nm-applet & nextcloud & flatpak run com.bitwarden.desktop)

# App autostart, mirroring the swaymsg "workspace N; exec" block in
# sway/config: terminal on 1, firefox on 2, Signal+WhatsApp on 5, Bridge on 9.
exec-once = [workspace 1 silent] ghostty --working-directory=$HOME/git/repo
exec-once = [workspace 2 silent] flatpak run org.mozilla.firefox
exec-once = [workspace 5 silent] flatpak run org.signal.Signal
exec-once = [workspace 5 silent] flatpak run io.github.mimbrero.WhatsAppDesktop
exec-once = [workspace 9 silent] flatpak run ch.protonmail.protonmail-bridge

# Monitors: kanshi.service runs on graphical-session.target (enabled
# image-wide) and applies profiles under Hyprland like under sway. eDP
# scale 1 is pinned in kanshi's laptop profile to beat Hyprland's 1.5
# auto-scale heuristic.

input {
    kb_layout = de
    kb_variant = nodeadkeys
    repeat_delay = 180
    repeat_rate = 55
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }
}

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(585b70aa)
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 7
        passes = 3
    }
}

# Gestures replaced gestures{workspace_swipe} in 0.56; taps default to on
gesture = 3, horizontal, workspace

animations {
    enabled = yes
    # speed is DECISECONDS (100ms per unit, lower = faster): 20 = 2s, 2 = 0.2s
    animation = windows, 1, 3, default
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# Binds mirror sway muscle memory: mouse-mod4 menu, hjkl focus, same keys
# for workspace movement, kill, fullscreen, floating.

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, M, exec, wlogout --protocol layer-shell
bind = $mainMod CONTROL, L, exec, hyprlock
# window overview: rofi wayland mode activates the picked toplevel itself,
# no swaymsg/hyprctl window-command needed
bind = ALT, TAB, exec, rofi -show window -theme ~/.config/rofi/themes/rounded-blue-dark.rasi -show-icons

bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
# Arrows do the same
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots via hyprshot (grimshot shells out to swaymsg, sway-only):
# area piping into swappy like sway, output and active-window modes
bind = $mainMod, PRINT, exec, hyprshot -m region -s | swappy -f -
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output --notify
bind = $mainMod CONTROL, PRINT, exec, hyprshot -m active -s | swappy -f -

# Volume, same as sway
bind = ,122, exec, amixer -q set Master 5%- | notify-send -a "volume" "decrease volume" -h int:value:$(pamixer --get-volume)
bind = ,123, exec, amixer -q set Master 5%+ | notify-send -a "volume" "increase volume" -h int:value:$(pamixer --get-volume)
bind = ,121, exec, amixer -q set Master toggle | notify-send -a "volume" "mute" -h int:value:$(pamixer --get-volume)

# Brightness, same as sway
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-