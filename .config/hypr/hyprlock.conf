# hyprlock - simple: blurred live screenshot, clock, password field.
background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    brightness = 0.4
    color = rgba(1e1e2eee)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%a %d %b  %H:%M')"
    font_size = 56
    font_family = Roboto
    color = rgba(ffffffe6)
    position = 0, 260
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    capslock_color = -1
    font_family = Roboto
    placeholder_text = <i>password</i>
}