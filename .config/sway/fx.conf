# SwayFX extras. The #SWAYFX# lines are inert under plain sway - activate
# them once the swayfx binary is deployed:
#   sed -i 's/^#SWAYFX# //' ~/git/repo/dotfiles/.config/sway/fx.conf && swaymsg reload
blur enable
# Match Hyprland's decoration: size 7 / passes 3; brightness, saturation and
# noise stay neutral (1, 1, 0) - swayfx defaults would tint the blur.
blur_radius 5
blur_passes 2
blur_brightness 1
blur_saturation 1
blur_noise 0.0117
for_window [app_id="^((?!com\.mitchellh\.ghostty$).)*$"] blur disable
for_window [app_id="com\.mitchellh\.ghostty"] blur enable
# The lookahead criteria are PCRE2, verified in sway; app_id-less windows
# (XWayland) would keep blur - add a class rule if one ever annoys.