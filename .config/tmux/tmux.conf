# Shell as login shell
set -g default-command "zsh -l"

# Don't let tmux overwrite SSH_AUTH_SOCK (zshenv sets it)
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Prefix
set -g prefix C-b
bind C-b send-prefix

# Splits
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Close pane
bind x kill-pane
bind q kill-window
bind y setw synchronize-panes

# Tabs
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# Zoom toggle
bind z resize-pane -Z

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Mouse support
set -g mouse on

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Reduce escape delay (for nvim)
set -sg escape-time 0

# Pass focus events to nvim (so autoread fires)
set -g focus-events on

# History
set -g history-limit 50000

# Vi mode in copy + system clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status bar
set -g status-position top
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}"

# Session save/restore (tmux-resurrect + continuum)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# TPM bootstrap
run '~/.tmux/plugins/tpm/tpm'
