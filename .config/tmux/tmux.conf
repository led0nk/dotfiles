# Shell as login shell
set -g default-command "zsh -l"

# Don't let tmux overwrite SSH_AUTH_SOCK (zshenv sets it)
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

set -g prefix C-a
bind C-a send-prefix

# Copy mode on 'e' — '[' needs AltGr on a German keyboard
bind e copy-mode

# Splits
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Close pane
bind x kill-pane
bind q kill-window
bind y setw synchronize-panes

# Floating popup (toggleable scratch session)
bind g run-shell "tmux popup -E -w 80% -h 80% 'tmux attach -t scratch || tmux new -s scratch'"

# Tabs
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# Swap pane positions (< and >)
bind < swap-pane -U
bind > swap-pane -D

# Rename window (prefix ,) and session (prefix .). tmux can't distinguish
# Ctrl+/,+ from bare ,/., — the prefix comma/period IS the "ctrl+" chord
# here. C-r stays on rename-window too; C-R is tmux-resurrect restore.
bind , command-prompt -I '#W' 'rename-window -- "%%"'
bind . command-prompt -I '#S' 'rename-session -- "%%"'
bind C-r command-prompt -I '#W' 'rename-window -- "%%"'

# Reload config (moved off r, which renames the window now)
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Mouse support
set -g mouse on

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
# window names stay what they were renamed to (prefix+,); no auto-rename from
# the running command
setw -g automatic-rename off

# Renumber windows on close
set -g renumber-windows on

# Colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Reduce escape delay (for nvim)
set -sg escape-time 0

# Extended keys: gets the outer terminal to report Shift+Enter etc. as its own
# sequence so Claude's input can see it (needs tmux >= 3.4 and a VTE terminal).
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# Pass focus events to nvim (so autoread fires)
set -g focus-events on

# History
set -g history-limit 50000

# Vi mode in copy + Wayland clipboard (pbcopy is macOS-only, wl-copy is here)
setw -g mode-keys vi
set -s set-clipboard external
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel
# copy-pipe-and-cancel, NOT copy-selection-and-cancel: the old alias ignores
# its pipe argument in tmux 3.7 — buffer was made, clipboard never got it.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
# paste last tmux buffer (also Ctrl+Shift+v in most terminals)
bind P paste-buffer -p

# Status bar
set -g status-position top

set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_status_right_separator "#[bg=default] "
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#1e1e2e"
set -g @catppuccin_window_current_number_color "#fab387"
set -g @catppuccin_window_current_text_color "#1e1e2e"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-restore "C-R"
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'laktak/extrakto'
set -g @override_copy_command "wl-copy"
set -g @plugin 'tmux-plugins/tmux-yank'
bind f run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind F run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/main.sh"
set-environment -g FZF_DEFAULT_OPTS "--layout=reverse --color=bg:-1,bg+:#313244,fg:#cdd6f4,fg+:#cdd6f4,hl:#f38ba8,hl+:#f38ba8 --color=info:#6c7086,prompt:#cba6f7,pointer:#f5e0dc,marker:#a6e3a1,spinner:#f5e0dc,header:#6c7086"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rickstaa/tmux-notify'

# vim-tmux-navigator keeps the tmux-side defaults (root C-h/j/k/l): zsh cursor
# movement moved to Alt (see .zshrc), so these chords only mean pane walking
# now; nvim additionally forwards at split edges to tmux via select-pane.

# Alt movement inside non-editor inputs (zsh line editing, claude/ollama
# prompt): claude's input box understands arrows and word keys, not Alt-hjkl
# like zsh does, so translate at the tmux root. Editors pass through.
bind -n M-h if-shell 'bash "$HOME/.config/tmux/is-vim.sh" "#{pane_tty}"' 'send-keys M-h' 'send-keys Left'
bind -n M-l if-shell 'bash "$HOME/.config/tmux/is-vim.sh" "#{pane_tty}"' 'send-keys M-l' 'send-keys Right'
bind -n M-j if-shell 'bash "$HOME/.config/tmux/is-vim.sh" "#{pane_tty}"' 'send-keys M-j' 'send-keys M-b'
bind -n M-k if-shell 'bash "$HOME/.config/tmux/is-vim.sh" "#{pane_tty}"' 'send-keys M-k' 'send-keys M-f'
bind -n M-w if-shell 'bash "$HOME/.config/tmux/is-vim.sh" "#{pane_tty}"' 'send-keys M-w' 'send-keys C-w'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'

# TPM bootstrap
run '~/.tmux/plugins/tpm/tpm'
